name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: System packages (FFmpeg, Qt offscreen deps)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Live YouTube test (informational)
        continue-on-error: true
        run: uv run pytest -q --live -m live

  windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      live: false
