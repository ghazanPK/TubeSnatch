[project]
name = "tubesnatch"
version = "1.0.0"
description = "TubeSnatch: a GUI for downloading YouTube videos and playlists as MP4 or MP3, built on yt-dlp"
authors = [
    { name = "ALI GHAZANFAR", email = "38058692+ghazanPK@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "brotli>=1.2.1",
    "certifi>=2026.10.23",
    "deno>=2.9.8",
    "mutagen>=1.48.1",
    "pyside6-essentials>=6.12",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "websockets>=17.4",
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs>=0.8",
]

[project.scripts]
tubesnatch = "tubesnatch:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
